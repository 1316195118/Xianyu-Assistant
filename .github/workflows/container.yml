name: container

# 正式发版时更新 latest；也可以在 Actions 里手动触发一次。
# 不生成版本号标签，用户始终只需要拉取 latest。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: 校验发布标签
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(python3 -c "import json;print(json.load(open('version/state.json'))['version'])")"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::标签 v$tag 与 version/state.json 的 $version 不一致"
            exit 1
          fi

      - name: 构建 Linux 二进制
        working-directory: server
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o ../xianyu-stat-linux-amd64 .

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/1316195118/xianyu-stat:latest
          labels: |
            org.opencontainers.image.source=https://github.com/1316195118/Xianyu-Assistant
            org.opencontainers.image.revision=${{ github.sha }}
