name: container

# 正式发版时更新 latest；也可以在 Actions 里手动触发一次。
# 不生成版本号标签，用户始终只需要拉取 latest。
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: 后端测试与静态检查
        working-directory: server
        run: |
          go test -count=1 ./...
          go vet ./...

      - name: 前端依赖审计与构建
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm audit --omit=dev --audit-level=high
          npm run build

      - name: 校验浏览器扩展并刷新下载包
        run: |
          node --test tools/goofish_extension/background.test.js
          python3 tools/package_goofish_extension.py
          mkdir -p server/webroot/downloads
          cp static/downloads/goofish-extension.zip server/webroot/downloads/goofish-extension.zip
          cp static/downloads/goofish-extension-version.json server/webroot/downloads/goofish-extension-version.json

      - name: 校验发布标签
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(python3 -c "import json;print(json.load(open('version/state.json'))['version'])")"
          tag="${GITHUB_REF_NAME#v}"
          if [[ "$tag" != "$version" ]]; then
            echo "::error::标签 v$tag 与 version/state.json 的 $version 不一致"
            exit 1
          fi

      - name: 构建 Linux 二进制
        working-directory: server
        env:
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags="-s -w" -o ../xianyu-stat-linux-amd64 .

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ghcr.io/1316195118/xianyu-assistant:latest
          labels: |
            org.opencontainers.image.source=https://github.com/1316195118/Xianyu-Assistant
            org.opencontainers.image.revision=${{ github.sha }}

      - name: 清理非 latest 镜像标签
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 3
          gh api --paginate \
            "users/1316195118/packages/container/xianyu-assistant/versions?per_page=100" \
            --jq '.[] | select(.metadata.container.tags | length > 0) | select((.metadata.container.tags | sort) != ["latest"]) | .id' |
          while read -r version_id; do
            [[ -n "$version_id" ]] || continue
            gh api -X DELETE \
              "users/1316195118/packages/container/xianyu-assistant/versions/$version_id"
          done

