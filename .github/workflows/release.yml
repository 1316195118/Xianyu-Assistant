name: release

# 打 v 开头的标签就发版：产物正是应用内「在线更新」要拉的文件。
# 二进制里已经嵌入了 server/webroot（前端产物随代码提交），
# 所以这里不需要再跑 npm，编译即可，产物可复现。
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod

      - name: 校验浏览器扩展并刷新下载包
        run: |
          node --test tools/goofish_extension/background.test.js
          python3 tools/package_goofish_extension.py
          mkdir -p server/webroot/downloads
          cp static/downloads/goofish-extension.zip server/webroot/downloads/goofish-extension.zip
          cp static/downloads/goofish-extension-version.json server/webroot/downloads/goofish-extension-version.json

      - name: 校验标签与代码版本一致
        run: |
          tag="${GITHUB_REF_NAME#v}"
          ver="$(python3 -c "import json;print(json.load(open('version/state.json'))['version'])")"
          echo "tag=$tag version=$ver"
          if [ "$tag" != "$ver" ]; then
            echo "::error::标签 v$tag 与 version/state.json 的 $ver 不一致，请先改版本号或换标签"
            exit 1
          fi

      - name: 构建 Linux 与 Windows 二进制
        working-directory: server
        env:
          CGO_ENABLED: '0'
        run: |
          go build -trimpath -ldflags="-s -w" -o ../xianyu-stat-linux-amd64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../xianyu-stat.exe .

      - name: 生成 sha256
        run: |
          sha256sum xianyu-stat-linux-amd64 > xianyu-stat-linux-amd64.sha256
          sha256sum xianyu-stat.exe > xianyu-stat.exe.sha256
          cat *.sha256

      - name: 生成中文发布说明
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          state = json.loads(Path("version/state.json").read_text(encoding="utf-8"))
          note = str(state.get("note", "")).strip()
          headings = [line[3:].strip() for line in note.splitlines() if line.startswith("## ")]
          allowed = {"优化", "修复", "新增"}
          if not headings or any(h not in allowed for h in headings):
              raise SystemExit("发布说明只允许包含「优化 / 修复 / 新增」三段")
          Path("release-notes.md").write_text(note + "\n", encoding="utf-8")
          PY
          cat release-notes.md

      - name: 发布
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: false
          files: |
            xianyu-stat-linux-amd64
            xianyu-stat-linux-amd64.sha256
            xianyu-stat.exe
            xianyu-stat.exe.sha256
            static/downloads/goofish-extension.zip
            static/downloads/goofish-extension-version.json
