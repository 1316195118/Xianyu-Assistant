# 闲鱼售卖统计 —— docker compose 部署
#
#   拉取最新版：docker compose pull
#   启动：      docker compose up -d
#   查看日志：  docker compose logs -f
#   停止：      docker compose down
#
# 数据分三个独立目录，都以命名卷保存，删容器不丢数据：
#   data/   —— 数据库 xianyu.db（订单、账单、设置）
#   config/ —— 其他运行期文件（附件截图等）
#   backup/ —— 自动/手动备份
#
# 用户无需填写版本号，始终拉取 latest。
services:
  xianyu-assistant:
    image: ghcr.io/1316195118/xianyu-assistant:latest
    pull_policy: always
    container_name: xianyu-assistant
    restart: unless-stopped
    ports:
      # 绿联 NAS 的 8080 常被系统服务占用，默认改用 18083。
      - "18083:8080"
    environment:
      TZ: Asia/Shanghai
      PORT: "8080"
    volumes:
      - xianyu-data:/data
      - xianyu-config:/config
      - xianyu-backup:/backup
    healthcheck:
      # 用 alpine 自带的 busybox wget 探活；绝对不能拿二进制自身当探针，
      # 那会额外拉起一个实例（抢端口/写同一份数据）。
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/api/version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  xianyu-data:
  xianyu-config:
  xianyu-backup:
