<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content：键盘弹出时让布局视口随之缩小，
         底部抽屉才不会被软键盘顶出可视区（Chrome 108+ 生效，老内核忽略）。 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>闲鱼售卖统计</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#f7a600" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="闲鱼记账" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <script>
      (function () {
        try {
          var m = localStorage.getItem('xy-theme') || 'system';
          var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var mo = localStorage.getItem('xy-motion') || 'system';
          var reduce = mo === 'reduce' || (mo === 'system' && window.matchMedia('(prefers-reduced-motion: reduce)').matches);
          document.documentElement.setAttribute('data-motion', reduce ? 'reduce' : 'full');
        } catch (e) {}

        // 真实可视高度写入 --app-vh：老内核（微信 X5 / iOS 15.4 以下）不认识 dvh，
        // 若只依赖 dvh，底部抽屉会按内容撑到两千多像素、顶部被裁到屏幕外且无法滚动。
        // visualViewport 能反映软键盘弹出后的实际高度，用它统一兜住所有移动端环境。
        var setVH = function () {
          var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight || 0;
          if (h > 0) document.documentElement.style.setProperty('--app-vh', h + 'px');
        };
        try {
          setVH();
          window.addEventListener('resize', setVH, { passive: true });
          window.addEventListener('orientationchange', setVH, { passive: true });
          if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', setVH, { passive: true });
          }
        } catch (e) {}
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-UgJX8Sv2.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-Bvc6_3lq.css">
      <meta name="xy-build" content="ecf5b5522e" />
    <meta name="xy-version" content="1.2.3.9" />
  </head>
  <body>
    <div id="app"></div>

  </body>
</html>
