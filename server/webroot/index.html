    <script>
      (function () {
        try {
          var m = localStorage.getItem('xy-theme') || 'system';
          var dark = m === 'dark' || (m === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
          document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
          var mo = localStorage.getItem('xy-motion') || 'system';
          var reduce = mo === 'reduce' || (mo === 'system' && window.matchMedia('(prefers-reduced-motion: reduce)').matches);

        // 真实可视高度写入 --app-vh：老内核（微信 X5 / iOS 15.4 以下）不认识 dvh，

        // visualViewport 能反映软键盘弹出后的实际高度，用它统一兜住所有移动端环境。
        var setVH = function () {
          var h = (window.visualViewport && window.visualViewport.height) || window.innerHeight || 0;
          if (h > 0) document.documentElement.style.setProperty('--app-vh', h + 'px');
        };
        try {
          setVH();
          window.addEventListener('resize', setVH, { passive: true });
          window.addEventListener('orientationchange', setVH, { passive: true });
          if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', setVH, { passive: true });
          }
        } catch (e) {}
      })();
